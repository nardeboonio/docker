name: Publish the image

# Every three hours the latest stable release of Nardeboon gets its image, on
# GitHub's registry and on Docker Hub, if it doesn't have one yet; on a push
# or by hand, it's built again (by hand, any version).
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (empty: the latest stable)"
        required: false
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/nardeboonio/nardeboon
  HUB_IMAGE: docker.io/nardeboonio/nardeboon

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub, once its token is set
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$HUB_TOKEN" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN isn't set: the image goes to GitHub's registry alone"
          fi

      - uses: docker/login-action@v3
        if: steps.hub.outputs.on == 'true'
        with:
          username: nardeboonio
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Which version
        id: version
        env:
          WANTED: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://pkgs.nardeboon.io/releases/stable.json | jq -r .release | base64 -d | jq -r .version)
          version=${WANTED:-$latest}
          case "$version" in "" | *[!0-9A-Za-z.~-]*) echo "not a version: $version" >&2; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$version" = "$latest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = schedule ] && docker manifest inspect "$GHCR_IMAGE:$version" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$version has its image already"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tags
        id: tags
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
          HUB: ${{ steps.hub.outputs.on }}
        run: |
          images="$GHCR_IMAGE"
          [ "$HUB" = true ] && images="$images $HUB_IMAGE"
          tags=
          for image in $images; do
            tags="$tags,$image:$VERSION"
            [ "$LATEST" = true ] && tags="$tags,$image:latest"
          done
          echo "tags=${tags#,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.build == 'true'

      - uses: docker/build-push-action@v6
        if: steps.version.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: NB_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true

      - name: The image runs
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --entrypoint nardeboon "$GHCR_IMAGE:$VERSION" version | tee /dev/stderr | grep -q "nardeboon $VERSION "
